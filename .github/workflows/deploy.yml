name: Deploy to Apache

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /var/www/html

            git fetch --all
            git reset --hard origin/main

            cat > /var/www/html/config.local.php <<'PHP'
            <?php
            return [
              'db' => [
                'dsn'  => 'mysql:host=${{ secrets.DB_HOST }};port=${{ secrets.DB_PORT }};dbname=${{ secrets.DB_NAME }};charset=utf8mb4',
                'user' => '${{ secrets.DB_USER }}',
                'pass' => '${{ secrets.DB_PASS }}',
              ],
            ];
            PHP

            sudo chown www-data:www-data /var/www/html/config.local.php
            sudo chmod 640 /var/www/html/config.local.php